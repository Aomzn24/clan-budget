<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เงินแคลน Buddy!</title>
    <!-- โหลด Tailwind CSS สำหรับแต่งเว็บสวยๆ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4">

    <div class="max-w-2xl mx-auto">
        <!-- หัวข้อเว็บ -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-emerald-400 mb-2">💰 เงินแคลน Buddy!</h1>
            <p class="text-slate-400 text-sm">ระบบตรวจสอบยอดเงินและความโปร่งใส (อัปเดตตลอด 24 ชม.)</p>
        </div>

        <!-- กล่องแสดงยอดรวมสุทธิ -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-6 shadow-lg flex justify-between items-center">
            <div>
                <p class="text-slate-400 text-sm">ยอดรวมสุทธิทั้งหมด</p>
                <h2 id="totalBalance" class="text-3xl font-extrabold text-white mt-1">กำลังโหลด...</h2>
            </div>
            <button onclick="toggleAdminPanel()" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-300 px-3 py-2 rounded-lg transition">
                ⚙️ โหมดแอดมิน
            </button>
        </div>

        <!-- แผงควบคุมของแอดมิน (ซ่อนไว้เริ่มต้น) -->
        <div id="adminPanel" class="hidden bg-slate-800 border border-emerald-500/30 rounded-2xl p-6 mb-6 shadow-xl">
            <h3 class="text-lg font-semibold text-emerald-400 mb-4">🔧 เพิ่มรายการ (สำหรับแอดมิน)</h3>
            <form id="addForm" onsubmit="handleSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">ชื่อ / รายการ</label>
                    <input type="text" id="inputName" required placeholder="เช่น ตี๋ หรือ ค่าไฟแคลน" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">จำนวนเงิน (ใส่ติดลบได้ เช่น -200)</label>
                    <input type="number" id="inputAmount" required placeholder="100" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">ลิงก์รูปสลิป (URL รูปภาพ)</label>
                    <input type="text" id="inputSlip" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 font-medium py-2 rounded-xl transition text-slate-950">
                    บันทึกข้อมูลลง Sheets
                </button>
            </form>
        </div>

        <!-- ตารางแสดงรายชื่อเพื่อน -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-6">ชื่อ / รายการ</th>
                            <th class="py-3 px-6 text-right">จำนวนเงิน</th>
                            <th class="py-3 px-6 text-center">สลิป</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700/55 text-sm">
                        <tr>
                            <td colspan="3" class="py-6 text-center text-slate-500">กำลังดึงข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal สำหรับแสดงรูปสลิปขนาดใหญ่ -->
    <div id="slipModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50" onclick="closeModal()">
        <div class="relative max-w-lg w-full bg-slate-800 rounded-2xl p-4 overflow-hidden">
            <img id="modalImg" src="" alt="สลิปโอนเงิน" class="w-full h-auto rounded-lg">
            <p class="text-center text-xs text-slate-400 mt-3">คลิกที่ใดก็ได้เพื่อปิด</p>
        </div>
    </div>

    <script>
        // ⚠️ นำ Web App URL ที่ได้จากขั้นตอนที่ 2 มาใส่ไว้ในเครื่องหมายคำพูดนี้
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz733YnLDVC51yVmrUTfMle4jSarlxnieYZKeztvNahMHGdU_UnozZYTr2dGQ-WtSOS/exec";

        async function fetchData() {
            try {
                let response = await fetch(WEB_APP_URL);
                let data = await response.json();
                renderTable(data);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="3" class="py-6 text-center text-red-400">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
            }
        }

        function renderTable(data) {
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let total = 0;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-slate-500">ยังไม่มีข้อมูล</td></tr>`;
                document.getElementById('totalBalance').innerText = '0 บาท';
                return;
            }

            data.forEach(item => {
                let amount = parseFloat(item.amount) || 0;
                total += amount;

                let amountClass = amount >= 0 ? 'text-emerald-400' : 'text-rose-400';
                let amountSign = amount >= 0 ? `+${amount}` : amount;

                let slipHtml = item.slipUrl 
                    ? `<button onclick="openModal('${item.slipUrl}')" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1 rounded-md text-emerald-300 transition">ดูสลิป</button>`
                    : `<span class="text-slate-600 text-xs">-</span>`;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-4 px-6 font-medium text-slate-200">${item.name}</td>
                    <td class="py-4 px-6 text-right font-semibold ${amountClass}">${amountSign} ฿</td>
                    <td class="py-4 px-6 text-center">${slipHtml}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalBalance').innerText = total.toLocaleString() + ' บาท';
            document.getElementById('totalBalance').className = `text-3xl font-extrabold mt-1 ${total >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
        }

        function toggleAdminPanel() {
            let panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        async function handleSubmit(event) {
            event.preventDefault();
            let btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            let payload = {
                name: document.getElementById('inputName').value,
                amount: document.getElementById('inputAmount').value,
                slipUrl: document.getElementById('inputSlip').value
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert('บันทึกข้อมูลสำเร็จ!');
                document.getElementById('addForm').reset();
                toggleAdminPanel();
                setTimeout(fetchData, 1500); // รอ 1.5 วิแล้วดึงข้อมูลใหม่มาแสดง
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการบันทึก');
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูลลง Sheets';
            }
        }

        function openModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('slipModal').classList.remove('hidden');
            document.getElementById('slipModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('slipModal').classList.remove('flex');
            document.getElementById('slipModal').classList.add('hidden');
        }

        // โหลดข้อมูลอัตโนมัติเมื่อเปิดหน้าเว็บ
        fetchData();
    </script>
</body>
</html>
